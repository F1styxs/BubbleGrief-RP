name: Build and Release Resource Pack

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Zip Resource Pack
        run: |
          zip -r BubbleGrief.zip . -x ".git/*" -x ".github/*" -x "README.md"

      - name: Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "BubbleGrief Resource Pack"
          files: BubbleGrief.zip
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Direct Raw Zip
        run: |
          cp BubbleGrief.zip /tmp/BubbleGrief.zip
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan pack
          git rm -rf .
          mv /tmp/BubbleGrief.zip ./BubbleGrief.zip
          git add BubbleGrief.zip
          git commit -m "Update BubbleGrief.zip"
          git push origin pack --force
