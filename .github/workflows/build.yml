name: Build and Release Resource Pack

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Zip Resource Pack
        run: |
          zip -r BubbleGrief.zip . -x ".git/*" -x ".github/*" -x "README.md"

      - name: Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "BubbleGrief Resource Pack"
          files: BubbleGrief.zip
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
